name: pycheck

on:
  push:

jobs:
  pycheck:
    name: mypy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install mypy
        run: pip install mypy
      - run: chmod +x scripts/ssl/issue-certs.py
      - name: Run mypy
        run: |
          set -eu
          git ls-files -z '*.py' \
            | xargs -0 -r mypy --python-version 3.14
