user www-data www-data;

worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 32768;
worker_shutdown_timeout 45s;

error_log  /wwwdata/openresty/logs/error.log warn;
pid        /wwwdata/openresty/run/nginx.pid;

# pcre_jit on;

load_module modules/ngx_http_vhost_traffic_status_module.so;
# load_module modules/ngx_http_flv_live_module.so;

events {
    worker_connections 2048;
}

http {
    charset utf-8;
    charset_types text/plain text/css text/xml text/vnd.wap.wml
                  application/json application/manifest+json application/xml
                  application/javascript text/javascript application/x-javascript
                  application/rss+xml application/xhtml+xml image/svg+xml application/atom+xml;

    include       mime.types;
    default_type  application/octet-stream;
    index         index.php index.html;

    sendfile       on;
    tcp_nopush     on; # enabled only when sendfile is used.
    tcp_nodelay    on;
    server_tokens  off;
    etag           on;

    client_body_buffer_size    64k; # a client request body is buffered to a temporary file ...
    client_max_body_size       96m; # 客户端参数
    client_body_timeout        60s; # 客户端参数 408 (Request Time-out)
    keepalive_timeout          75s;
#    keepalive_requests         1000;

    # 减少 an upstream response is buffered to a temporary file:
    fastcgi_buffer_size 128k;
    fastcgi_buffers 16 128k;
    fastcgi_busy_buffers_size 256k;
    fastcgi_temp_file_write_size 256k;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $time_iso8601 $ttyyyy {
        volatile;
        default "9999";
        "~^(\d{4})-(\d{2})-(\d{2})" $1;
    }
    map $time_iso8601 $ttmm {
        volatile;
        default "99";
        "~^(\d{4})-(\d{2})-(\d{2})" $2;
    }
    map $time_iso8601 $ttdd {
        volatile;
        default "99";
        "~^(\d{4})-(\d{2})-(\d{2})" $3;
    }
    map $status $http_status_level {
        volatile;
        default "xxx";
        "~^1\d{2}$" "1xx";
        "~^2\d{2}$" "2xx";
        "~^3\d{2}$" "3xx";
        "~^4\d{2}$" "4xx";
        "~^5\d{2}$" "5xx";
    }

    log_format json_log_format escape=json
      '{'
        '"time_iso8601":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"server_name":"$server_name",'
        '"host":"$host",'
        '"server_protocol":"$server_protocol",'
        '"content_type":"$content_type",'
        '"content_length":"$content_length",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"query_string":"$query_string",'
        '"request_time":"$request_time",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"msec":$msec'
      '}';

    access_log  /wwwdata/openresty/logs/json.$ttyyyy.$ttmm.$http_status_level.log json_log_format;


    gzip             on;
    gzip_comp_level  5;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json application/xml
                     text/javascript application/x-javascript application/rss+xml
                     text/xml application/xhtml+xml image/svg+xml application/atom+xml;
    # gzip_proxied     off;
    gzip_vary        on;


    limit_conn_zone $binary_remote_addr zone=conn_perip_php:16m;
    limit_conn_log_level warn;
    limit_conn_status 444;

    limit_req_zone $binary_remote_addr  zone=req_perip_php:16m             rate=5r/s;
    limit_req_zone $binary_remote_addr  zone=req_perip_php_per_minute:16m  rate=120r/m;
    limit_req_zone $request_uri  zone=req_per_uri_per_minute:128m  rate=90r/m;
    limit_req_log_level warn;
    limit_req_status 444;

    lua_shared_dict dogs 16m;
    lua_shared_dict risk_addr_count 128m;
    lua_shared_dict tigers_qps 128m;

    vhost_traffic_status_zone;
    vhost_traffic_status_filter_by_host on;

    server {
        listen      80  default_server;
        listen [::]:80  default_server;
        server_name    _;
        root           /wwwdata/www;

        location ~ \.php {
            set $php_fastcgi 127.0.0.1:9000;
            fastcgi_pass $php_fastcgi;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            # see https://github.com/zendtech/ZendOptimizerPlus/issues/126
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME  $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT    $realpath_root;
        }
    }

    include /wwwdata/openresty/nginxconf/http.d/*.conf;
}

include /wwwdata/openresty/nginxconf/rtmp.d/*.conf;
