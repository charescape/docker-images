# Valkey 9.1 config
#
# 运行环境：
#   CPU(s): 2 vCPU
#   Mem: 4 GiB
#   Disk: 100 GiB SSD
#   OS: Ubuntu 24.04
#   arch: x86_64
#   timezone: Asia/Shanghai
#   Valkey Version: 9.1.2，源码编译
#   类型：独立单实例，非 cluster / sentinel
#
# 访问方式：优先 TCP（本机/局域网/公网 IP + 6379），socket 仅作备选。
#
# ACL 用户在 /wwwdata/valkey/run/users.acl；default 已关闭，必须 AUTH。
#   valkey-cli --user vkadmin -a vkadmin123 ping
#   valkey-cli --user vkprod -a vkprod123 ping
# 连接默认落在 DB 0。vklocal / vktesting 没有 DB 0，AUTH 后先 SELECT。
#
# 不使用 requirepass。
#
# TLS 已编进二进制，本配置不启用 TLS 端口。

bind 0.0.0.0
port 6379
protected-mode yes
daemonize no
supervised no
pidfile "/wwwdata/valkey/run/valkey.pid"
logfile "/wwwdata/valkey/run/valkey.log"
loglevel notice
dir "/wwwdata/valkey/data"
dbfilename "dump.rdb"
unixsocket "/wwwdata/valkey/run/valkey.sock"
unixsocketperm 770

timeout 0
tcp-backlog 511
tcp-keepalive 300
databases 32
aclfile "/wwwdata/valkey/run/users.acl"

maxmemory 2gb
maxmemory-policy noeviction
maxmemory-clients 5%
oom-score-adj yes
io-threads 1

save 3600 1
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes
rdb-save-incremental-fsync yes

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb
aof-use-rdb-preamble yes
aof-load-truncated yes
